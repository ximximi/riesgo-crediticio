services:
  postgres:
    image: postgres:15
    container_name: db_riesgo_crediticio
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-riesgo_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
  pipeline_python:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: entorno_scripts
    depends_on:
      - postgres
    volumes:
      - ./scripts:/app/scripts 
      - ./data:/app/data       
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-admin}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-admin123}
      - DB_NAME=${POSTGRES_DB:-riesgo_db}
    command: tail -f /dev/null

volumes:
  postgres_data: